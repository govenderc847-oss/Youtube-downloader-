<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Stream Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; }
    
    body {
      background: #0f172a;
      background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.12) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.5px; }
    .header p { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input, select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    button:hover { opacity: 0.95; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #result-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .status-info { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; }
    .status-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

    .video-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .dl-btn {
      display: block;
      text-align: center;
      padding: 12px;
      background: #22c55e;
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .dl-btn:hover { background: #16a34a; }

    .disclaimer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Stream Extractor</h1>
      <p>Educational Media Extraction Tool</p>
    </div>

    <div class="form-group">
      <label for="url">Media URL</label>
      <input type="url" id="url" placeholder="Paste link here..." required />
    </div>

    <div class="form-group">
      <label for="format">Format</label>
      <select id="format">
        <option value="mp4">Video (MP4)</option>
        <option value="mp3">Audio (MP3)</option>
      </select>
    </div>

    <button id="extract-btn" onclick="extractMedia()">Extract Stream</button>

    <div id="result-box"></div>

    <p class="disclaimer">
      This tool is created strictly for educational purpose to study API interactions and media parsing.
    </p>
  </div>

  <script>
    // Paste your live Render URL here (without trailing slash):
    const RENDER_BACKEND_URL = 'https://YOUR-APP-NAME.onrender.com';

    async function extractMedia() {
      const urlInput = document.getElementById('url').value.trim();
      const formatType = document.getElementById('format').value;
      const resultBox = document.getElementById('result-box');
      const btn = document.getElementById('extract-btn');

      if (!urlInput) {
        showStatus('Please enter a valid media link.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Extracting...';
      showStatus('Connecting to cloud backend...', 'info');

      try {
        const response = await fetch(`${RENDER_BACKEND_URL}/download`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: urlInput, format: formatType })
        });

        const data = await response.json();

        if (response.ok && data.url) {
          resultBox.className = 'status-info';
          resultBox.style.display = 'block';
          resultBox.innerHTML = `
            <div class="video-title">${data.title || 'Media Ready'}</div>
            <a class="dl-btn" href="${data.url}" target="_blank" rel="noopener noreferrer" download>Download Direct File</a>
          `;
        } else {
          showStatus(data.error || 'Failed to parse stream URL.', 'error');
        }
      } catch (err) {
        showStatus('Backend server unreachable. Verify Render URL.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Extract Stream';
      }
    }

    function showStatus(message, type) {
      const resultBox = document.getElementById('result-box');
      resultBox.className = type === 'error' ? 'status-error' : 'status-info';
      resultBox.innerText = message;
      resultBox.style.display = 'block';
    }
  </script>

</body>
</html>
